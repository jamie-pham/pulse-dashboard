# XcodeGen spec — generates Pulse.xcodeproj. On your Mac:
#   brew install xcodegen && cd ios && cp Config.example.xcconfig Config.xcconfig && xcodegen
# (Re-run `xcodegen` after pulling changes. The .xcodeproj is generated, not committed.)
name: Pulse
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Pulse:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).pulse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pulse
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: pulse
            CFBundleURLSchemes: [pulse]
        PulseHost: $(PULSE_HOST)
        PulseToken: $(PULSE_TOKEN)
    dependencies:
      - target: PulseWidgets
  PulseWidgets:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).pulse.widgets
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Pulse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        PulseHost: $(PULSE_HOST)
        PulseToken: $(PULSE_TOKEN)
schemes:
  Pulse:
    build:
      targets:
        Pulse: all
        PulseWidgets: all
    run:
      config: Debug
